pluginManagement {
    repositories {
        google()
        maven {
            url "https://maven.aliyun.com/repository/gradle-plugin"
        }
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // ✅ Maven Central mirror (primary)
        maven {
            url "https://maven.aliyun.com/repository/central"
        }

        // ✅ Android / Google artifacts
        google()

        // ✅ Fallback (if mirror misses something)
        mavenCentral()
    }
}

rootProject.name = "KfcGiftCardVault"
include(":app")
