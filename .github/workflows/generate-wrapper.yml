name: Generate REAL Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  wrapper:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Generate real Gradle wrapper (Gradle 8.6)
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.6

      - name: Commit real wrapper files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add android/gradlew android/gradlew.bat android/gradle/wrapper
          git commit -m "Add real Gradle wrapper (8.6)"
          git push
